name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Upload build directory
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - name: Download build directory
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build
      - name: LS build directory
        run: |
          ls -R build
          ls -l build/test_figure_finder build/test_matrix build/compare_all
          chmod +x build/test_figure_finder build/test_matrix build/compare_all || true
      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  benchmark:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - name: Download build directory
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build
      - name: LS build directory
        run: |
          ls -R build
          ls -l build/test_figure_finder build/test_matrix build/compare_all
          chmod +x build/test_figure_finder build/test_matrix build/compare_all || true
      - name: Run benchmarks
        run: ./build/compare_all || true