name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Upload build directory
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - name: Download build directory
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build
      - name: LS build directory
        run: |
          ls -R build
          ls -l build/bin/test_figure_finder build/bin/test_matrix build/bin/compare_all
          chmod +x build/bin/test_figure_finder build/bin/test_matrix build/bin/compare_all || true
      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  benchmark:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - name: Download build directory
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build
      - name: LS build directory
        run: |
          ls -R build
          ls -l build/bin/test_figure_finder build/bin/test_matrix build/bin/compare_all
          chmod +x build/bin/test_figure_finder build/bin/test_matrix build/bin/compare_all || true
      - name: Run benchmarks
        run: ./build/bin/compare_all "data/matrix_5000x4000_1M.txt" "Extra Large 1M figures" "data/matrix_7500x6000_5M.txt" "Extra Large 5M figures" || true

  sanitizers:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, tsan]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang

      - name: Make scripts executable
        run: |
          chmod +x scripts/sanitizers/run_${{ matrix.sanitizer }}.sh

      - name: Run ${{ matrix.sanitizer }}
        run: |
          ./scripts/sanitizers/run_${{ matrix.sanitizer }}.sh figure_finder_app data/matrix_2000x1500_50K.txt

  profilers:
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        tool: [heaptrack, massif, memcheck, perf]

    steps:
      - uses: actions/checkout@v4

      - name: Download build directory
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build

      - name: Ensure profiling_results dir exists
        run: mkdir -p profiling_results

      # Install the right tools for each profiler
      - name: Install profiler tools
        run: |
          sudo apt-get update
          case "${{ matrix.tool }}" in
            heaptrack)
              sudo apt-get install -y heaptrack
              ;;
            massif|memcheck)
              sudo apt-get install -y valgrind
              ;;
            perf)
              sudo apt-get install -y linux-tools-common linux-tools-generic linux-tools-$(uname -r)
              ;;
          esac

      - name: Make scripts executable
        run: |
          chmod +x scripts/profilers/${{ matrix.tool }}/run_${{ matrix.tool }}.sh scripts/profilers/${{ matrix.tool }}/analyze_${{ matrix.tool }}.sh || true
          chmod +x build/bin/figure_finder_app || true

      - name: Run profiler
        run: |
          ./scripts/profilers/${{ matrix.tool }}/run_${{ matrix.tool }}.sh profiling_results ./build/bin/figure_finder_app data/matrix_2000x1500_50K.txt
      - name: Analyze profiler results
        run: |
          case "${{ matrix.tool }}" in
          heaptrack)
            export PARAMETER=100
            ;;
          massif)
            export PARAMETER=500
            ;;
          memcheck|perf)
            export PARAMETER=
            ;;
          esac
          ./scripts/profilers/${{ matrix.tool }}/analyze_${{ matrix.tool }}.sh profiling_results $PARAMETER

      - name: Upload profiler artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.tool }}"
          path: profiling_results
